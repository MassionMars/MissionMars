<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MISSION: MARS promo</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.otf)}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.otf)}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-Bold.otf)}
@font-face{font-family:Inter;font-weight:800;src:url(fonts/Inter-ExtraBold.otf)}
@font-face{font-family:Caladea;font-style:italic;font-weight:400;src:url(fonts/Caladea-Italic.ttf)}
@font-face{font-family:Caladea;font-style:italic;font-weight:700;src:url(fonts/Caladea-BoldItalic.ttf)}
:root{--bg:#12080f;--bone:#f4e7d4;--ink:#2a1218;--rust:#c4562e;--rust2:#e8743c;--ochre:#eaa45c;--mute:#b99a86}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--bg);font-family:Inter,sans-serif;transform-origin:0 0}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.light{background:var(--bone);color:var(--ink)}
.dark{background:radial-gradient(120% 90% at 70% 110%,#3a1710 0%,#1b0c12 45%,#12080f 100%);color:var(--bone)}
.abs{position:absolute}
.w{display:inline-block;white-space:pre;will-change:transform,opacity,filter}
.big{font-weight:800;letter-spacing:-.035em;line-height:1.02}
.acc{font-family:Caladea,serif;font-style:italic;font-weight:700;color:var(--rust);letter-spacing:-.01em}
.dark .acc{color:var(--rust2)}
.mono{font:600 20px Inter;letter-spacing:.22em;text-transform:uppercase}
#hud{position:absolute;inset:0;pointer-events:none}
#hud .l,#hud .r{position:absolute;top:44px;font:700 20px Inter;letter-spacing:.24em}
#hud .l{left:64px}#hud .r{right:64px}
#bar{position:absolute;left:64px;right:64px;bottom:40px;height:4px;background:rgba(128,128,128,.25);border-radius:2px}
#bar i{display:block;height:100%;width:0;background:var(--rust);border-radius:2px}
.wipe{position:absolute;top:-10px;bottom:-10px;width:2100px;left:0;display:none}
.phone{position:absolute;width:414px;height:896px;border-radius:62px;background:#0b0508;border:2px solid #3a2028;box-shadow:0 50px 120px rgba(0,0,0,.45),0 0 0 10px #1a0d12;overflow:hidden;transform-origin:0 0}
.phone img{position:absolute;left:0;top:0;width:414px;height:auto;will-change:opacity}
.pill{position:absolute;padding:16px 26px;border-radius:999px;font:700 30px Inter;letter-spacing:-.01em;white-space:nowrap;background:var(--ink);color:var(--bone)}
.dark .pill{background:var(--bone);color:var(--ink)}
.pill b{color:var(--rust2)}
.dot{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--rust);margin:-11px 0 0 -11px;box-shadow:0 0 0 6px rgba(196,86,46,.28)}
svg{overflow:visible}
.row{position:absolute;left:110px;right:110px;height:96px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:52px;letter-spacing:-.02em}
.row .tw{color:var(--ochre)}
.stat b{display:block;font-weight:800;font-size:118px;letter-spacing:-.05em;line-height:1}
.stat span{font:600 28px Inter;color:#6f4a3c}
.chip{position:absolute;padding:18px 34px;border-radius:20px;background:rgba(244,231,212,.1);border:2px solid rgba(244,231,212,.25);font:700 38px Inter}
</style>
</head>
<body>
<div id="stage">
  <div id="s1" class="scene light"></div>
  <div id="s2" class="scene dark"></div>
  <div id="s3" class="scene light"></div>
  <div id="s4" class="scene dark"></div>
  <div id="s5" class="scene light"></div>
  <div id="s6" class="scene dark"></div>
  <div id="s7" class="scene dark"></div>
  <div id="wipeA" class="wipe" style="background:#c4562e"></div>
  <div id="wipeB" class="wipe" style="background:#12080f"></div>
  <div id="hud"><div class="l">MISSION: MARS</div><div class="r">NASA SPACE APPS CHALLENGE</div><div id="bar"><i></i></div></div>
</div>
<script src="anim.js"></script>
</body>
</html>
